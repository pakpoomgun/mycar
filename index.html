<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Fuel & LPG Tracker</title>
  <!-- นำเข้า Tailwind CSS เพื่อความสวยงามแบบ Modern และ Chart.js สำหรับวาดกราฟ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .tab-active { border-bottom-width: 4px; border-color: #3b82f6; color: #3b82f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="pb-20">

  <!-- แท็บเมนูด้านบน -->
  <div class="bg-white shadow sticky top-0 z-50">
    <div class="flex justify-around text-center text-gray-500 font-medium">
      <button id="tabDashboardBtn" onclick="switchTab('dashboard')" class="w-1/2 py-4 tab-active">
        <i class="fa-solid fa-chart-pie mr-2"></i>หน้าแรก / กราฟ
      </button>
      <button id="tabFormBtn" onclick="switchTab('form')" class="w-1/2 py-4">
        <i class="fa-solid fa-gas-pump mr-2"></i>บันทึก & ประวัติ
      </button>
    </div>
  </div>

  <div class="container mx-auto max-w-lg p-4">
    
    <!-- ================= SECTION 1: DASHBOARD ================= -->
    <div id="sectionDashboard" class="space-y-4">
      <!-- การ์ดสรุปยอด -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-4 text-white shadow-md">
          <p class="text-xs opacity-80 uppercase tracking-wider">เงินที่ใช้เดือนนี้</p>
          <p class="text-2xl font-bold mt-1" id="statThisMonth">0.00 <span class="text-sm font-normal">บาท</span></p>
        </div>
        <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-4 text-white shadow-md">
          <p class="text-xs opacity-80 uppercase tracking-wider">เลขกิโลล่าสุด</p>
          <p class="text-2xl font-bold mt-1" id="statLatestMileage">0 <span class="text-sm font-normal">กม.</span></p>
        </div>
      </div>

      <!-- ส่วนควบคุมกราฟ -->
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-gray-800 text-lg">ค่าใช้จ่ายรายเดือน</h2>
          <select id="chartFilter" onchange="updateChart()" class="bg-gray-100 border-none rounded-lg text-sm p-2 text-gray-700 focus:ring-2 focus:ring-blue-500">
            <option value="6">ย้อนหลัง 6 เดือน</option>
            <option value="12">ย้อนหลัง 1 ปี</option>
            <option value="all" selected>ทั้งหมด</option>
          </select>
        </div>
        <div class="relative w-full h-64">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>
    </div>

    <!-- ================= SECTION 2: FORM & HISTORY ================= -->
    <div id="sectionForm" class="hidden space-y-6">
      <!-- ฟอร์มกรอกข้อมูล -->
      <form id="fuelForm" onsubmit="handleSubmit(event)" class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
        <h2 id="formTitle" class="font-bold text-gray-800 text-lg border-b pb-2"><i class="fa-solid fa-plus-circle text-blue-500 mr-2"></i>บันทึกการเติมเชื้อเพลิง</h2>
        <input type="hidden" id="recordId">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">วันที่เติม</label>
            <input type="date" id="date" required class="w-full border rounded-xl p-2.5 text-sm focus:outline-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">เลขกิโลเมตร</label>
            <input type="number" id="mileage" required placeholder="เช่น 124500" class="w-full border rounded-xl p-2.5 text-sm focus:outline-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-2">ประเภทเชื้อเพลิง</label>
          <div class="flex gap-4">
            <label class="flex items-center bg-gray-50 border p-3 rounded-xl flex-1 cursor-pointer hover:bg-gray-100">
              <input type="radio" name="type" value="Gasoline" checked onchange="triggerCalculation()" class="mr-2 w-4 h-4 text-blue-600">
              <span class="text-sm font-medium text-gray-700">Gasoline</span>
            </label>
            <label class="flex items-center bg-gray-50 border p-3 rounded-xl flex-1 cursor-pointer hover:bg-gray-100">
              <input type="radio" name="type" value="LPG" onchange="triggerCalculation()" class="mr-2 w-4 h-4 text-blue-600">
              <span class="text-sm font-medium text-gray-700">LPG</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label id="labelTotalPaid" class="block text-xs font-semibold text-gray-500 mb-1">จำนวนเงินที่จ่าย (บาท)</label>
            <input type="number" id="totalPaid" step="any" required oninput="triggerCalculation()" placeholder="0.00" class="w-full border rounded-xl p-2.5 text-sm focus:outline-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">ราคาต่อลิตร (บาท)</label>
            <input type="number" id="pricePerLiter" step="any" required oninput="triggerCalculation()" placeholder="0.00" class="w-full border rounded-xl p-2.5 text-sm focus:outline-blue-500">
          </div>
        </div>

        <!-- กล่องแสดงผลลัพธ์คำนวณอัตโนมัติ -->
        <div id="calcPreview" class="bg-blue-50 border border-blue-100 p-3 rounded-xl text-xs space-y-1 text-blue-800">
          <div class="flex justify-between"><span>จำนวนลิตร (คำนวณ):</span> <span id="viewLiters" class="font-bold">0.00 ลิตร</span></div>
          <div class="flex justify-between"><span>ส่วนลดที่ได้:</span> <span id="viewDiscount" class="font-bold">0 บาท</span></div>
          <div class="flex justify-between text-sm pt-1 border-t border-blue-200 mt-1">
            <span class="font-bold text-blue-900">ยอดสุทธิที่จะบันทึก:</span> <span id="viewNetPaid" class="font-bold text-blue-900">0.00 บาท</span>
          </div>
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden w-1/3 bg-gray-200 text-gray-700 p-3 rounded-xl font-medium hover:bg-gray-300">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white p-3 rounded-xl font-medium hover:bg-blue-700 shadow-md">บันทึกข้อมูล</button>
        </div>
      </form>

      <!-- ส่วนประวัติแยกตามเดือน -->
      <div class="space-y-3">
        <h3 class="font-bold text-gray-800 text-md"><i class="fa-solid fa-history text-gray-500 mr-2"></i>ประวัติการเติมเชื้อเพลิง</h3>
        <div id="historyContainer" class="space-y-4">
          <!-- ข้อมูลประวัติจะถูกใส่เข้ามาด้วย JavaScript -->
          <p class="text-center text-sm text-gray-400 py-4">กำลังโหลดประวัติ...</p>
        </div>
      </div>
    </div>
    
  </div>

  <!-- JavaScript โลจิกฝั่งหน้าบ้าน -->
  <script>
    let globalData = [];
    let myChart = null;

    // รันอัตโนมัติเมื่อเปิดหน้าเว็บครั้งแรก
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      loadData();
    });

    function loadData() {
      google.script.run.withSuccessHandler((data) => {
        globalData = data;
        updateDashboard();
        updateChart();
        renderHistory();
      }).getFuelData();
    }

    // สลับหน้าจอแท็บ
    function switchTab(tab) {
      if (tab === 'dashboard') {
        document.getElementById('sectionDashboard').classList.remove('hidden');
        document.getElementById('sectionForm').classList.add('hidden');
        document.getElementById('tabDashboardBtn').classList.add('tab-active');
        document.getElementById('tabFormBtn').classList.remove('tab-active');
      } else {
        document.getElementById('sectionDashboard').classList.add('hidden');
        document.getElementById('sectionForm').classList.remove('hidden');
        document.getElementById('tabDashboardBtn').classList.remove('tab-active');
        document.getElementById('tabFormBtn').classList.add('tab-active');
      }
    }

    // โลจิกคำนวณสิทธิพิเศษ LPG ของคุณตามเงื่อนไขเป๊ะๆ
    function runCalculation() {
      const type = document.querySelector('style') ? document.querySelector('input[name="type"]:checked').value : 'Gasoline';
      const inputMoney = parseFloat(document.getElementById('totalPaid').value) || 0;
      const pricePerLiter = parseFloat(document.getElementById('pricePerLiter').value) || 0;

      let calculatedLiters = 0;
      let discount = 0;
      let finalPaid = inputMoney;

      if (inputMoney > 0 && pricePerLiter > 0) {
        if (type === 'LPG') {
          // 1. คำนวณจำนวนลิตรดิบ แล้วตัดเศษลิตรทิ้ง (FLOOR)
          calculatedLiters = Math.floor(inputMoney / pricePerLiter);
          // 2. คำนวณส่วนลดเบื้องต้นลิตรละ 0.50 บาท
          let rawDiscount = calculatedLiters * 0.5;
          // 3. เงื่อนไขใหม่: ถ้าส่วนลดมีเศษสตางค์ ให้ตัดเศษทิ้งให้เหลือเต็มบาท
          discount = Math.floor(rawDiscount);
          // 4. หักยอดจ่ายจริงลงตามส่วนลด
          finalPaid = inputMoney - discount;
        } else {
          // กรณี Gasoline คำนวณตรงๆ ไม่หักเศษ
          calculatedLiters = Number((inputMoney / pricePerLiter).toFixed(2));
          discount = 0;
          finalPaid = inputMoney;
        }
      }

      return { calculatedLiters, discount, finalPaid };
    }

    function triggerCalculation() {
      const res = runCalculation();
      document.getElementById('viewLiters').innerText = res.calculatedLiters + ' ลิตร';
      document.getElementById('viewDiscount').innerText = res.discount + ' บาท';
      document.getElementById('viewNetPaid').innerText = res.finalPaid.toFixed(2) + ' บาท';
    }

    // สรุปยอดด้านบนสุดของหน้าแรก
    function updateDashboard() {
      if (globalData.length === 0) return;

      // หาเลขกิโลสูงสุด
      const mileages = globalData.map(d => parseInt(d.mileage)).filter(m => !isNaN(m));
      const latestMileage = mileages.length > 0 ? Math.max(...mileages) : 0;
      document.getElementById('statLatestMileage').innerText = latestMileage.toLocaleString();

      // หาเงินที่ใช้เฉพาะเดือนนี้
      const currentMonthStr = new Date().toISOString().substring(0, 7); // "yyyy-MM"
      const thisMonthTotal = globalData
        .filter(d => d.date && d.date.substring(0, 7) === currentMonthStr)
        .reduce((sum, d) => sum + (parseFloat(d.totalPaid) || 0), 0);
      
      document.getElementById('statThisMonth').innerText = thisMonthTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    // ฟังก์ชันวาดกราฟแท่งแยกค่าน้ำมันและแก๊สรายเดือน
    function updateChart() {
      if (globalData.length === 0) return;

      const filterValue = document.getElementById('chartFilter').value;
      
      // จัดกลุ่มข้อมูลแยกตาม เดือน-ปี และประเภทเชื้อเพลิง
      let monthlyMap = {};
      globalData.forEach(item => {
        if (!item.date) return;
        const monthKey = item.date.substring(0, 7); // ได้ค่าโครงสร้าง "yyyy-MM"
        if (!monthlyMap[monthKey]) {
          monthlyMap[monthKey] = { Gasoline: 0, LPG: 0 };
        }
        if (item.type === 'Gasoline' || item.type === 'LPG') {
          monthlyMap[monthKey][item.type] += (parseFloat(item.totalPaid) || 0);
        }
      });

      // เรียงลำดับเดือนจากอดีตมาปัจจุบัน
      let sortedMonths = Object.keys(monthlyMap).sort();

      // กรองตามเงื่อนไขตัวเลือก (6 เดือน / 1 ปี / ทั้งหมด)
      if (filterValue !== 'all') {
        const limit = parseInt(filterValue);
        sortedMonths = sortedMonths.slice(-limit);
      }

      const gasolineData = sortedMonths.map(m => monthlyMap[m].Gasoline);
      const lpgData = sortedMonths.map(m => monthlyMap[m].LPG);

      // จัดการตัวแปลกราฟเดิมป้องกันกราฟซ้อน
      if (myChart) myChart.destroy();

      const ctx = document.getElementById('expenseChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sortedMonths,
          datasets: [
            { label: 'Gasoline', data: gasolineData, backgroundColor: '#3b82f6', borderRadius: 6 },
            { label: 'LPG', data: lpgData, backgroundColor: '#f59e0b', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
          plugins: { legend: { position: 'top' } }
        }
      });
    }

    // เรนเดอร์ส่วนประวัติแยกหมวดหมู่เป็นรายเดือน
    function renderHistory() {
      const container = document.getElementById('historyContainer');
      if (globalData.length === 0) {
        container.innerHTML = '<p class="text-center text-sm text-gray-400 py-4">ยังไม่มีข้อมูลบันทึก</p>';
        return;
      }

      // เรียงประวัติจากใหม่ไปเก่า (ล่าสุดอยู่บนสุด)
      let sortedData = [...globalData].sort((a, b) => b.date.localeCompare(a.date));

      // จัดกลุ่มข้อมูลตามเดือนเพื่อแยกหัวข้อแสดงผล
      let groups = {};
      sortedData.forEach(item => {
        const monthName = new Date(item.date).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
        if (!groups[monthName]) groups[monthName] = [];
        groups[monthName].push(item);
      });

      let html = '';
      for (let month in groups) {
        html += `<div class="space-y-2">
          <div class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1 mt-4">${month}</div>`;
        
        groups[month].forEach(item => {
          const typeColor = item.type === 'Gasoline' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800';
          const formattedDate = new Date(item.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
          
          html += `
            <div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
              <div class="space-y-0.5">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${typeColor}">${item.type}</span>
                  <span class="text-sm font-bold text-gray-800">${parseFloat(item.totalPaid).toLocaleString()} บาท</span>
                </div>
                <div class="text-xs text-gray-500">
                  ${formattedDate} • วิ่งไป ${parseInt(item.mileage).toLocaleString()} กม. (${item.calculatedLiters} ลิตร)
                  ${item.discount > 0 ? `• <span class="text-emerald-600">ลด ${item.discount}บ.</span>` : ''}
                </div>
              </div>
              <div class="flex gap-1">
                <button onclick="editRecord(${item.id})" class="text-blue-500 hover:bg-blue-50 p-2 rounded-lg text-sm"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteRecord(${item.id})" class="text-red-500 hover:bg-red-50 p-2 rounded-lg text-sm"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>`;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    }

    // จัดการบันทึกเมื่อกดปุ่ม Submit ฟอร์ม
    function handleSubmit(event) {
      event.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึก...';

      const calcs = runCalculation();

      const record = {
        id: document.getElementById('recordId').value || null,
        date: document.getElementById('date').value,
        mileage: document.getElementById('mileage').value,
        type: document.querySelector('input[name="type"]:checked').value,
        totalPaid: calcs.finalPaid, // บันทึกเงินยอดสุทธิที่หักส่วนลดแล้วลงไป
        pricePerLiter: document.getElementById('pricePerLiter').value,
        calculatedLiters: calcs.calculatedLiters,
        discount: calcs.discount
      };

      google.script.run.withSuccessHandler(() => {
        resetForm();
        loadData();
        switchTab('dashboard');
      }).saveRecord(record);
    }

    // ฟังก์ชันกดแก้ไขข้อมูล
    function editRecord(id) {
      const item = globalData.find(d => d.id == id);
      if (!item) return;

      document.getElementById('recordId').value = item.id;
      document.getElementById('date').value = item.date;
      document.getElementById('mileage').value = item.mileage;
      
      // ติ๊กเลือก Radio Type เดิม
      document.querySelectorAll('input[name="type"]').forEach(radio => {
        if (radio.value === item.type) radio.checked = true;
      });

      // เนื่องจากหน้าชีตเก็บค่าที่ 'หักส่วนลดแล้ว' 
      // แต่หน้ากรอกข้อมูลผู้ใช้ต้องการพิมพ์ยอดเงินเต็มก่อนหัก เราจึงต้องบวกส่วนลดกลับคืนไปแสดงผล
      const originalPaid = parseFloat(item.totalPaid) + (parseFloat(item.discount) || 0);
      document.getElementById('totalPaid').value = originalPaid;
      document.getElementById('pricePerLiter').value = item.pricePerLiter;

      triggerCalculation();

      // เปลี่ยน UI ฟอร์มให้เป็นโหมดแก้ไข
      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-amber-500 mr-2"></i>แก้ไขข้อมูล';
      document.getElementById('submitBtn').innerText = 'บันทึกการแก้ไข';
      document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-amber-500');
      document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-amber-600');
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      // เลื่อนแท็บมาที่หน้าฟอร์ม
      switchTab('form');
    }

    // ฟังก์ชันกดลบข้อมูล
    function deleteRecord(id) {
      if (confirm('คุณแน่ใจใช่ไหมว่าต้องการลบรายการนี้? เมื่อลบแล้วข้อมูลใน Google Sheet จะหายไปด้วย')) {
        google.script.run.withSuccessHandler((res) => {
          if (res.success) loadData();
          else alert(res.message);
        }).deleteRecord(id);
      }
    }

    // รีเซ็ตค่าในฟอร์มกลับเป็นเริ่มต้น
    function resetForm() {
      document.getElementById('recordId').value = '';
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      document.getElementById('mileage').value = '';
      document.getElementById('totalPaid').value = '';
      document.getElementById('pricePerLiter').value = '';
      document.querySelector('input[name="type"][value="Gasoline"]').checked = true;
      
      triggerCalculation();

      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-plus-circle text-blue-500 mr-2"></i>บันทึกการเติมเชื้อเพลิง';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerText = 'บันทึกข้อมูล';
      document.getElementById('submitBtn').classList.replace('bg-amber-500', 'bg-blue-600');
      document.getElementById('submitBtn').classList.replace('hover:bg-amber-600', 'hover:bg-blue-700');
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }
  </script>
</body>
</html>
