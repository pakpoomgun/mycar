<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเติมน้ำมัน LPG และการซ่อมบำรุงรถยนต์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="pb-24">

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-car-side text-2xl text-yellow-300"></i>
                <h1 class="font-bold text-lg tracking-wide">CarCare & Fuel Pro</h1>
            </div>
            <div class="text-xs bg-indigo-900 px-2.5 py-1.5 rounded-full text-blue-200" id="connection-status">
                <i class="fa-solid fa-sync fa-spin mr-1 text-yellow-400"></i> กำลังเชื่อมต่อคลาวด์...
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 mt-4 space-y-4">

        <section id="tab-dashboard" class="space-y-4">
            <!-- (เนื้อหาเดิมของ Dashboard ยังคงเหมือนเดิม) -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-500">เลขไมล์สะสมล่าสุด</p>
                    <p class="text-2xl font-bold text-indigo-900" id="dash-current-mileage">0 <span class="text-sm font-normal text-gray-400">กม.</span></p>
                </div>
                <div class="bg-indigo-50 p-3 rounded-full text-indigo-600">
                    <i class="fa-solid fa-gauge text-xl"></i>
                </div>
            </div>

            <!-- ส่วนอื่นๆ ของ Dashboard (ย่อไว้เพื่อความกระชับ) -->
            <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-4 shadow-sm border border-orange-200">
                <div class="flex items-center space-x-2 text-orange-800 font-bold mb-2">
                    <i class="fa-solid fa-triangle-exclamation text-lg text-orange-500"></i>
                    <h2>การเช็คระยะกิโลเมตรถัดไป</h2>
                </div>
                <p class="text-xs text-gray-600 mb-3" id="dash-alert-next-title">กำลังคำนวณ...</p>
                <div class="space-y-2 max-h-48 overflow-y-auto" id="dash-next-items-list"></div>
                <div class="mt-3 pt-3 border-t border-orange-200 flex justify-between text-xs font-semibold text-orange-950">
                    <span>งบประมาณที่คาดว่าจะใช้:</span>
                    <span id="dash-next-budget">0 บาท</span>
                </div>
            </div>

            <!-- เพิ่มส่วนอื่นของ Dashboard ตามเดิม (chart, planner, ตารางมาตรฐาน) -->
            <!-- ... (สามารถ copy จากไฟล์เดิมได้) ... -->

        </section>

        <section id="tab-fuel" class="hidden space-y-4">
            <!-- Fuel Tab เดิม (ไม่เปลี่ยน) -->
            <!-- ... คงเดิม ... -->
        </section>

        <section id="tab-maintenance" class="hidden space-y-4">
            <!-- Maintenance Form เดิม -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <!-- เนื้อหา form ซ่อมบำรุงเดิมทั้งหมด (คงเดิม) -->
                <!-- ... copy จากไฟล์เดิม ... -->
            </div>

            <!-- === ส่วนใหม่: รายการรอยืนยันสถานะ === -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-amber-500"></i>
                    รายการรอยืนยันสถานะ
                </h3>
                <div id="pending-maint-list" class="space-y-2 max-h-64 overflow-y-auto">
                    <!-- Render โดย JavaScript -->
                </div>
            </div>

            <!-- ประวัติการตรวจเช็คล่าสุด -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-gray-800 text-sm">ประวัติการตรวจเช็คล่าสุด</h3>
                    <button onclick="fetchCloudData()" class="text-xs text-indigo-600 font-semibold hover:underline">
                        <i class="fa-solid fa-arrows-rotate mr-0.5"></i>รีเฟรช
                    </button>
                </div>
                <div class="space-y-2 max-h-64 overflow-y-auto" id="maint-history-list"></div>
            </div>
        </section>

        <section id="tab-config" class="hidden space-y-4">
            <!-- Config Tab เดิม (คงเดิม) -->
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50">
        <!-- Nav เดิม (คงเดิม) -->
    </nav>

    <div id="custom-toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300">
        <div class="bg-gray-900 text-white px-4 py-2.5 rounded-2xl shadow-xl flex items-center space-x-2 text-sm font-semibold">
            <i class="fa-solid fa-circle-check text-green-400" id="toast-icon"></i>
            <span id="toast-message">บันทึกสำเร็จ!</span>
        </div>
    </div>

    <script>
        const MasterMaintenanceItems = [ /* ... คงเดิม ... */ ];

        let fuelLogs = [];
        let maintLogs = [];
        let activeFuelType = "Gasoline";
        let expenseChartInstance = null;
        
        let defaultGSheetUrl = "https://script.google.com/macros/s/YOUR_WEBAPP_URL/exec";
        let gsheetUrl = defaultGSheetUrl; 

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fuel-date').value = today;
            document.getElementById('maint-date').value = today;

            loadLocalData();
            populateMasterScheduleTable();
            document.getElementById('btn-calc-planner').addEventListener('click', runInteractivePlanner);
            
            fetchCloudData();
        });

        // === โค้ดเดิมทั้งหมด (loadLocalData, saveLocalData, fetchCloudData, switchTab, etc.) ===
        // ... (คัดลอกส่วนที่เหลือจากไฟล์เดิมของคุณมา) ...

        function updateDashboard() {
            const maxFuelMil = fuelLogs.length > 0 ? Math.max(...fuelLogs.map(l => l.mileage)) : 0;
            const maxMaintMil = maintLogs.length > 0 ? Math.max(...maintLogs.map(l => l.mileage)) : 0;
            const currentMileage = Math.max(maxFuelMil, maxMaintMil);

            document.getElementById('dash-current-mileage').innerHTML = `${currentMileage.toLocaleString()} <span class="text-sm font-normal text-gray-400">กม.</span>`;

            calculateNextCheckUpPlan(currentMileage);
            populateMonthDropdown();
            renderMonthlyStats();
            renderFuelHistory();
            renderMaintHistory();
            renderPendingMaintenance();        // ← เพิ่มบรรทัดนี้
        }

        // === ฟังก์ชันใหม่สำหรับรายการรอยืนยัน ===
        function renderPendingMaintenance() {
            const pendingList = document.getElementById('pending-maint-list');
            if (!pendingList) return;

            const pendingItems = maintLogs.filter(log => log.status === "N" || log.status === null || log.status === undefined || log.status === "");

            if (pendingItems.length === 0) {
                pendingList.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">ไม่มีรายการที่ต้องยืนยันในขณะนี้</div>`;
                return;
            }

            let html = `<div class="text-xs font-bold text-amber-700 mb-3">รายการรอยืนยัน (${pendingItems.length} รายการ)</div>`;

            html += pendingItems.map(log => {
                const date = new Date(log.date).toLocaleDateString('th-TH', { 
                    day: 'numeric', month: 'short', year: 'numeric' 
                });
                return `
                  <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl">
                    <div class="flex justify-between items-start">
                      <div class="flex-1">
                        <p class="font-semibold text-gray-800">${log.category}</p>
                        <p class="text-xs text-gray-500">${date} • ${log.mileage.toLocaleString()} กม.</p>
                        ${log.details && log.details !== '-' ? `<p class="text-xs text-gray-600 mt-1">${log.details}</p>` : ''}
                      </div>
                      <div class="text-right">
                        <p class="font-bold text-emerald-600">${Number(log.cost || 0).toLocaleString()} ฿</p>
                      </div>
                    </div>
                    <button onclick="confirmMaintenance('${log.id}')" 
                            class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i>
                        ยืนยันการซ่อมบำรุงแล้ว
                    </button>
                  </div>`;
            }).join('');

            pendingList.innerHTML = html;
        }

        function confirmMaintenance(id) {
            if (!confirm("ยืนยันว่ารายการนี้เสร็จสมบูรณ์แล้วใช่หรือไม่?")) return;

            const payload = {
                action: "updateStatus",
                sheetName: "maintenance",
                id: id,
                status: "Y"
            };

            fetch(gsheetUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                showToast("✅ ยืนยันสำเร็จ สถานะเปลี่ยนเป็น Y", true);
                setTimeout(fetchCloudData, 800); // รีเฟรชข้อมูล
            })
            .catch(error => {
                console.error(error);
                showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", false);
            });
        }

        // === ฟังก์ชันอื่นๆ (renderFuelHistory, renderMaintHistory, syncWithGSheets, showToast ฯลฯ) คงเดิม ===
        // ... คัดลอกส่วนที่เหลือจากไฟล์เดิมของคุณ ...

        // ตัวอย่าง syncWithGSheets (ปรับให้เรียก fetchCloudData หลังส่ง)
        function syncWithGSheets(sheetType, data) {
            if (!gsheetUrl) return;
            const payload = { action: "addData", sheetName: sheetType, ...data };
            fetch(gsheetUrl, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
            })
            .then(() => {
                showToast(`ส่งข้อมูลไปยัง Google Sheet เรียบร้อย!`, true);
                setTimeout(fetchCloudData, 1000);
            })
            .catch(() => showToast("ส่งข้อมูลสำเร็จ (Local)", true));
        }
    </script>
</body>
</html>
