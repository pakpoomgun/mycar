<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกการเติมน้ำมัน LPG และการซ่อมบำรุงรถยนต์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-car-side text-2xl text-yellow-300"></i>
                <h1 class="font-bold text-lg tracking-wide">CarCare & Fuel Pro</h1>
            </div>
            <div class="text-xs bg-indigo-900 px-2.5 py-1.5 rounded-full text-blue-200" id="connection-status">
                <i class="fa-solid fa-sync fa-spin mr-1 text-yellow-400"></i> กำลังเชื่อมต่อคลาวด์...
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-3 mt-4 space-y-4">
        <section id="tab-dashboard" class="space-y-4">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-xs text-gray-500">เลขไมล์สะสมล่าสุด</p>
                    <p class="text-2xl font-bold text-indigo-900" id="dash-current-mileage">0 <span class="text-sm font-normal text-gray-400">กม.</span></p>
                </div>
                <div class="bg-indigo-50 p-3 rounded-full text-indigo-600">
                    <i class="fa-solid fa-gauge text-xl"></i>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <h2 class="font-bold text-gray-800 text-sm mb-3">กราฟภาพรวมค่าใช้จ่ายรายเดือน</h2>
                <canvas id="monthly-chart" class="w-full h-64"></canvas>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <h2 class="font-bold text-gray-800 text-sm mb-3"><i class="fa-solid fa-screwdriver-wrench text-blue-600 mr-2"></i>สืบค้นรอบเช็คระยะ</h2>
                <div class="flex space-x-2 mb-4">
                    <input type="number" id="planner-mileage-input" placeholder="ระบุเลขกิโลเมตร" class="flex-1 bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    <button id="btn-calc-planner" class="bg-indigo-600 text-white rounded-xl px-4 py-2 text-sm font-semibold hover:bg-indigo-700 transition">ตรวจสอบ</button>
                </div>
                <div id="planner-result-box" class="hidden bg-gray-50 rounded-xl p-3 border border-gray-200">
                    <div class="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
                        <span class="text-xs font-bold text-indigo-900" id="planner-result-title"></span>
                        <span class="text-xs font-bold text-red-600" id="planner-result-cost"></span>
                    </div>
                    <ul class="text-xs space-y-1.5 text-gray-700" id="planner-result-list"></ul>
                </div>
            </div>
        </section>

        </main>

    <script>
        // ... (คงตัวแปร MasterMaintenanceItems, fuelLogs, maintLogs ไว้เหมือนเดิม)
        
        let monthlyChart = null;

        function renderMonthlyStats() {
            const ctx = document.getElementById('monthly-chart').getContext('2d');
            const monthlyData = {};
            const process = (date, type, cost) => {
                const month = date.substring(0, 7);
                if (!monthlyData[month]) monthlyData[month] = { fuel: 0, lpg: 0, maint: 0 };
                if (type === 'LPG') monthlyData[month].lpg += cost;
                else if (type === 'Gasoline') monthlyData[month].fuel += cost;
                else monthlyData[month].maint += cost;
            };
            fuelLogs.forEach(log => process(log.date, log.type, log.totalPaid));
            maintLogs.forEach(log => process(log.date, 'maintenance', log.cost));

            const labels = Object.keys(monthlyData).sort();
            if (monthlyChart) monthlyChart.destroy();

            monthlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels.map(m => new Date(m + "-01").toLocaleDateString('th-TH', { month: 'short', year: '2-digit' })),
                    datasets: [
                        { label: 'เบนซิน', data: labels.map(m => monthlyData[m].fuel), backgroundColor: '#3b82f6' },
                        { label: 'LPG', data: labels.map(m => monthlyData[m].lpg), backgroundColor: '#22c55e' },
                        { label: 'ซ่อมบำรุง', data: labels.map(m => monthlyData[m].maint), backgroundColor: '#f59e0b' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } },
                    plugins: { legend: { labels: { font: { size: 10 } } } }
                }
            });
        }
        
        // อย่าลืมเรียกใช้ renderMonthlyStats() ในฟังก์ชัน updateDashboard() ของคุณด้วยนะครับ
    </script>
</body>
</html>
